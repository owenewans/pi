name: Environments

on:
  push:
    branches: [main, "durable-env-*"]
    paths:
      - "packages/durable/src/env/**"
      - "packages/durable/src/tools/**"
      - "packages/durable/test/env-*"
      - "packages/env/**"
      - ".github/workflows/env.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/durable/src/env/**"
      - "packages/durable/src/tools/**"
      - "packages/durable/test/env-*"
      - "packages/env/**"
      - ".github/workflows/env.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: env-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install SSH server
        run: |
          command -v sshd || test -x /usr/sbin/sshd || (
            sudo apt-get update
            sudo apt-get install -y openssh-server
          )

      - name: Daemon checks
        working-directory: packages/env/daemon
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build daemon
        working-directory: packages/env
        run: npm run build:daemon

      - name: Durable environment tests
        working-directory: packages/durable
        run: |
          node ../../node_modules/vitest/dist/cli.js --run \
            test/env-node.test.ts test/env-node-spill.test.ts \
            test/env-node-conformance.test.ts test/env-line-scan.test.ts \
            test/tools.test.ts test/tools-read-differential.test.ts

      - name: Remote environment tests
        working-directory: packages/env
        run: node ../../node_modules/vitest/dist/cli.js --run
